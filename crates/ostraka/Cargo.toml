[package]
name = "ostraka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Run agent fleets you can actually review."


[dependencies]
ostraka-core = { workspace = true }
ostraka-adapter = { workspace = true }
ostraka-runtime = { workspace = true }
clap = { workspace = true }
# Completions generated from the parser rather than written by hand. A hand-
# written script is a second description of the command line, and the second one
# is the one that goes stale — which is the drift `check-hygiene.sh` exists to
# catch everywhere else. By clap's own authors, pure Rust, no runtime.
clap_complete = { workspace = true }
# Task entries and benchmark results are files that outlive the process that
# wrote them, so they are derived rather than formatted by hand.
serde = { workspace = true }
serde_json = { workspace = true }
# The benchmark suite is a file somebody writes. Already in the workspace for
# adapter profiles; no new dependency reaches the binary.
toml = { workspace = true }
# The TUI, and nothing else it drags in. ratatui's defaults pull a second
# backend and a colour-conversion stack; `crossterm` alone is the terminal this
# ships against. Both are pure Rust with no runtime of their own, which is the
# condition under which a dependency here is allowed at all: the distribution
# advantage is a binary you can curl, and that survives a library.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false }
# Ctrl-C, which std has no portable way to catch. Tiny and pure Rust, which is
# the condition every dependency here meets: it adds no runtime to a binary
# whose distribution advantage is that it needs none. Without it, interrupting
# a run abandons a subprocess still writing into a worktree.
ctrlc = { version = "3.5", default-features = false }
