[package]
name = "ostraka-app"
version.workspace = true
edition.workspace = true
# Higher than the workspace's. The window draws with egui 0.36, which needs
# 1.95; the command line does not depend on it and keeps the lower floor.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Ostraka desktop application: browse and promote agent runs."

[dependencies]
ostraka-core = { workspace = true }
ostraka-runtime = { workspace = true }
serde_json = { workspace = true }
# Pure Rust, and no web runtime: `glow` rather than `wgpu` keeps the dependency
# set to what a window and a GL context need, and the default features pull a
# second renderer and a web backend this will never use.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"

[[bin]]
name = "ostraka-app"
path = "src/main.rs"
