[workspace]
resolver = "3"
members = [
    "crates/ostraka-core",
    "crates/ostraka-adapter",
    "crates/ostraka-runtime",
    "crates/ostraka-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bemindlabs/ostraka"
description = "Run agent fleets you can actually review."
authors = ["bemindlabs"]

[workspace.dependencies]
ostraka-core = { path = "crates/ostraka-core", version = "3.0.0" }
ostraka-adapter = { path = "crates/ostraka-adapter", version = "3.0.0" }
ostraka-runtime = { path = "crates/ostraka-runtime", version = "3.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
