# GitHub Copilot CLI.
#
# `--allow-all-tools` is what the CLI itself requires for non-interactive use, so
# the author invocation carries it and the reviewer's deliberately does not:
# without it no tool runs unconfirmed, which is exactly the reviewer's posture.
id = "copilot-cli"
command = "copilot"

args = [
    "-p",
    "{{prompt}}",
    "--allow-all-tools",
    "--silent",
    "--no-color",
    "--log-level",
    "none",
]

review_args = ["-p", "{{prompt}}", "--silent", "--no-color", "--log-level", "none"]

model_args = ["--model", "{{model}}"]
event_format = "none"

[capabilities]
headless = true
streams_json = false
resumable = true
