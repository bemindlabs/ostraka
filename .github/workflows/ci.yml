name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap, and it fails for reasons a compiler never will: a backend
      # instruction file that has drifted from AGENTS.md, plugin scribble that
      # reached a commit, a translation, or a gate in ci.yml that no longer
      # matches the one in ostraka.toml. Before the toolchain, so it reports in
      # seconds rather than after a build.
      - name: hygiene
        run: ./scripts/check-hygiene.sh

      # The desktop application is part of the workspace, so the gate compiles
      # it — and a window needs libraries a headless runner does not ship.
      #
      # tmux is here for one test, and it is here because that test skips
      # without it: copying goes through `tmux load-buffer` under tmux, and the
      # round trip is asserted against a server the test starts itself. A skip
      # nobody notices is how that stopped being checked once already.
      - name: install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The four checks below are the gate declared in ostraka.toml. The gate
      # this project enforces on others is the gate it passes itself, so these
      # must stay identical to that file.
      - name: format
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # Not one of the four: a check on the tests rather than on the code. A
      # test that writes into the checkout it runs from leaves debris that the
      # next `git add -A` commits, so a run must leave the tree as it found it.
      - name: tests leave the checkout clean
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "the test run changed the checkout:"
            echo "$dirty"
            exit 1
          fi
      - name: build
        run: cargo build --workspace --locked
