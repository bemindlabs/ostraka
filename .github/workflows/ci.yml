name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap, and it fails for reasons a compiler never will: a backend
      # instruction file that has drifted from AGENTS.md, plugin scribble that
      # reached a commit, a translation, or a gate in ci.yml that no longer
      # matches the one in ostraka.toml. Before the toolchain, so it reports in
      # seconds rather than after a build.
      - name: hygiene
        run: ./scripts/check-hygiene.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The four checks below are the gate declared in ostraka.toml. The gate
      # this project enforces on others is the gate it passes itself, so these
      # must stay identical to that file.
      - name: format
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: build
        run: cargo build --workspace --locked
